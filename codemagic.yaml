# Builds the iOS shell in ios/ and uploads it to TestFlight.
# The web app and server are not part of this build.
workflows:
  ios-testflight:
    name: Hangry iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      # Name of the App Store Connect API key under Codemagic → Integrations.
      app_store_connect: hangry
    environment:
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY.
        - hangry_ios
      vars:
        BUNDLE_ID: io.kurrle.hangry
      xcode: latest
    scripts:
      - name: Generate the Xcode project
        script: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          which xcodegen || brew install xcodegen
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Hangry.xcodeproj
      - name: Build the ipa
        script: |
          xcode-project build-ipa --project ios/Hangry.xcodeproj --scheme Hangry
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
